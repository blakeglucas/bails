<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/bails.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <link rel="stylesheet" href="/style.css"/>
    <link rel="stylesheet" href="/puppertino/puppertino.css"/>
    <title>Bails App</title>
</head>
<body>
<div class="container">
    <div>
        <a data-wml-openURL="https://github.com/blakeglucas/bails">
            <img src="/bails.png" class="logo" alt="Bails logo"/>
        </a>
        <a data-wml-openURL="https://developer.mozilla.org/en-US/docs/Web/JavaScript">
            <img src="/javascript.svg" class="logo vanilla" alt="JavaScript logo"/>
        </a>
    </div>
    <h1>Bails + Javascript</h1>
    <div class="card">
        <div class="result" id="result">Please enter your name below 👇</div>
        <div class="input-box" id="input">
            <input class="input" id="name" type="text" autocomplete="off"/>
            <button class="p-btn p-prim-col" onclick="doGreet()">Greet</button>
        </div>
    </div>
    <div class="footer">
        <div><p>Click on the Bails logo to learn more</p></div>
        <div><p id="time">Listening for Time event...</p></div>
    </div>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
