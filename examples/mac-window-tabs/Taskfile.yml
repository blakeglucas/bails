version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

# This example is a standalone Go module (its own go.mod, with a `replace`
# pointing at the local Bails checkout because MacWindowTabbingMode is not in a
# published release yet). It physically lives inside the bails module, so any go.work that
# covers bails would shadow this module: binding generation would find 0 services
# and `go mod tidy` would target bails instead. The repo no longer ships a
# workspace file, but contributors often create one locally, so force workspace
# mode off and the example always builds as itself. This is inherited by the
# bails dev/build subprocess tree and is a harmless no-op everywhere else.
env:
  GOWORK: "off"

vars:
  APP_NAME: "mac-window-tabs"
  BIN_DIR: "bin"
  VITE_PORT: '{{.BAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - bails dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
